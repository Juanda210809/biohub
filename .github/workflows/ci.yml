# Integración continua: corre en cada pull request y en cada cambio a main.
# Si algo falla aquí, el pull request no se puede unir a main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gateway:
    name: API Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de pruebas
        run: pip install -r gateway/requirements-test.txt ruff
      - name: Estilo (ruff)
        run: ruff check gateway/tests
      - name: Pruebas unitarias y de integracion de Kong
        run: python -m pytest gateway/tests -q

  servicios:
    name: Servicio ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [registro, gobernanza, identidad, consulta, reportes]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r servicios/${{ matrix.servicio }}/requirements.txt ruff
      - name: Estilo (ruff)
        run: ruff check servicios/${{ matrix.servicio }}
      - name: Pruebas (pytest)
        working-directory: servicios/${{ matrix.servicio }}
        run: python -m pytest -q

  portal:
    name: Portal Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  contenedores:
    name: Infraestructura y sistema completo
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r gateway/requirements-test.txt ruff
      - run: ruff check db/tests
      - name: Configuracion, arranque, replicacion y acceso por Kong
        run: python -m pytest db/tests -q

  punta-a-punta:
    name: Pruebas de punta a punta del portal
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Levantar el sistema completo con los datos de demostracion
        run: |
          cp .env.example .env
          docker compose up --build -d --wait --wait-timeout 300
      - name: Instalar Playwright
        working-directory: pruebas/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Recorrer el portal con cada rol
        working-directory: pruebas/e2e
        env:
          CI: "true"
        run: npx playwright test
      - name: Guardar el reporte si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-punta-a-punta
          path: pruebas/e2e/salida/
          retention-days: 7
      - name: Registros de los servicios si algo falla
        if: failure()
        run: docker compose logs --no-color --tail 200
